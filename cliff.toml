[changelog]
header = """
# Changelog

All notable changes are documented using [Keep a Changelog](https://keepachangelog.com/).

## [Unreleased]

"""
body = """
{% if version %}## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %} — {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}
{% if version and previous.version %}
[{{ version }}]: https://github.com/tdesaules/chez-moi/compare/{{ previous.version }}...{{ version }}
{% elif version %}
[{{ version }}]: https://github.com/tdesaules/chez-moi/releases/tag/{{ version }}
{% endif %}
"""
trim = true
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^[a-z]+(?:\\([^)]*\\))?!:", group = "Changed" },
  { body = "BREAKING[ -]CHANGE:", group = "Changed" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
# The selector/parsers exclude routine commits. no_increment_regex would also
# suppress breaking changes of those types (for example docs!), even when protected.
