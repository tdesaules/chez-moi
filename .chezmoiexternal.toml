[".config/usage/specs"]
    type = "archive"
    url = "https://github.com/tdesaules/usage-specs/archive/main.tar.gz"
    exact = true
    stripComponents = 1
    include = ["*/*.kdl"]

[".config/nvim"]
    type = "archive"
    url = "https://github.com/LazyVim/starter/archive/main.tar.gz"
    exact = true
    stripComponents = 1

[".config/DankMaterialShell/plugins/gopass-dms"]
    type = "archive"
    url = 'https://github.com/tdesaules/gopass-dms/archive/{{ .plugins.gopass }}.tar.gz'
    exact = true
    stripComponents = 1

[".config/DankMaterialShell/plugins/pinentry-dms"]
    type = "archive"
    url = 'https://github.com/tdesaules/pinentry-dms/releases/download/{{ .plugins.pinentry }}/pinentry-dms-plugin-{{ .plugins.pinentry | trimPrefix "v" }}.tar.gz'
    exact = true
    stripComponents = 1

[".config/opencode/skills"]
    type = "archive"
    url = "https://github.com/tdesaules/skills/archive/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "24h"
    # Keep skill directories and their resources, not repository documentation.
    exclude = ["*/.*", "*/AGENTS.md", "*/README.md", "*/LICENSE", "*/docs"]
