name: release
on:
  push:
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      has_lint: ${{ steps.plan.outputs.has_lint }}
      has_images: ${{ steps.plan.outputs.has_images }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      has_release: ${{ steps.plan.outputs.has_release }}
      lint_matrix: ${{ steps.plan.outputs.lint_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      plan_artifact: ${{ steps.plan.outputs.plan_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan complete release qualification
        id: plan
        uses: ./.github/actions/plan
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && 'prepare' || 'publish' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.plan.outputs.plan_artifact }}
          path: .build/plan.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
  lint:
    needs: check
    timeout-minutes: 30
    if: needs.check.outputs.has_lint == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - name: Validate workflows
        if: matrix.id == 'actionlint'
        uses: tdesaules/github-actions/lint/actionlint@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          files: ${{ toJSON(matrix.files) }}
      - name: Validate YAML
        if: matrix.id == 'yaml'
        uses: tdesaules/github-actions/lint/yaml@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          files: ${{ toJSON(matrix.files) }}
      - name: Validate action recipes
        if: matrix.id == 'hadolint'
        uses: tdesaules/github-actions/lint/hadolint@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          files: ${{ toJSON(matrix.files) }}
      - name: Validate Markdown
        if: matrix.id == 'markdownlint'
        uses: tdesaules/github-actions/lint/markdownlint@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          files: ${{ toJSON(matrix.files) }}
      - name: Validate rendered dotfiles
        if: matrix.id == 'chezmoi'
        uses: ./.github/actions/lint-chezmoi
      - name: Validate Renovate configuration
        if: matrix.id == 'renovate'
        uses: ./.github/actions/validate-renovate
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lint-${{ github.run_id }}-${{ matrix.id }}
          path: .build/reports/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
  build:
    needs: [check, lint]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          needs.check.outputs.has_images == 'true' && needs.lint.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      # No images/binaries are distributed by this repository, including on tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
  test:
    needs: [check, lint, build]
    timeout-minutes: 45
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          needs.check.outputs.has_tests == 'true' &&
          ((needs.check.outputs.has_lint == 'true' && needs.lint.result == 'success') ||
           (needs.check.outputs.has_lint == 'false' && needs.lint.result == 'skipped')) &&
          needs.check.outputs.has_images == 'false' && needs.build.result == 'skipped' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check all rendered release assets
        uses: ./.github/actions/check-assets
        with:
          token: ${{ github.token }}
      - name: Qualify exact source on native runner
        uses: tdesaules/github-actions/check/test-go@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          directory: .github/actions
      - name: Qualify chezmoi behavior on native runner
        uses: ./.github/actions/test-chezmoi
      - name: Retain qualification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qualification-${{ github.run_id }}-${{ matrix.arch }}
          path: .build/qualified/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
  release:
    needs: [check, lint, build, test]
    timeout-minutes: 20
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          needs.check.outputs.has_release == 'true' &&
          needs.check.outputs.has_lint == 'true' && needs.lint.result == 'success' &&
          needs.check.outputs.has_images == 'false' && needs.build.result == 'skipped' &&
          needs.check.outputs.has_tests == 'true' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.check.outputs.plan_artifact }}
          path: .build/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: qualification-${{ github.run_id }}-*
          merge-multiple: true
          path: .build/qualified/
      - name: Create preparation token
        if: needs.check.outputs.mode == 'prepare'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Prepare annotated source release
        if: needs.check.outputs.mode == 'prepare'
        uses: ./.github/actions/prepare-release
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Publish GitHub Release
        if: needs.check.outputs.mode == 'publish'
        uses: ./.github/actions/publish-release
        with:
          token: ${{ github.token }}
      - name: Retain release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.run_id }}
          path: .build/release.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
