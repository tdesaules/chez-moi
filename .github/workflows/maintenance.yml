name: maintenance
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate maintenance event
        id: guard
        uses: ./.github/actions/validate-maintenance
      - name: Create repository-scoped bot token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Update dependencies
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        uses: tdesaules/github-actions/maintenance/update-dependencies@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.app.outputs.token }}
      - name: Check rendered release assets
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        uses: ./.github/actions/check-assets
        with:
          token: ${{ github.token }}
      - name: Check documentation links
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        uses: tdesaules/github-actions/lint/lychee@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          files: '["README.md", ".github/CI.md"]'
      - name: Inventory source dependencies
        id: sbom
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        continue-on-error: true
        uses: tdesaules/github-actions/oci/new-sbom@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          source: dir:.
          format: syft-json
          output: .build/security/source.syft.json
      - name: Report source vulnerabilities
        id: scan
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        continue-on-error: true
        uses: tdesaules/github-actions/oci/test-vulnerabilities@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          sbom: .build/security/source.syft.json
          fail-on: none
          output: .build/security/grype.json
      - name: Summarize actual advisory outcomes
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        continue-on-error: true
        uses: tdesaules/github-actions/workflow/summarize-security@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          subject: git:${{ github.sha }}
          sbom-outcome: ${{ steps.sbom.outcome }}
          scan-outcome: ${{ steps.scan.outcome }}
          sbom: .build/security/source.syft.json
          report: .build/security/grype.json
      - name: Retain functional diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maintenance-${{ github.run_id }}
          path: .build/reports/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Retain advisory diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-${{ github.run_id }}
          path: .build/security/
          include-hidden-files: true
          if-no-files-found: warn
