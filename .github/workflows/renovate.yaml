name: renovate

on:
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate renovate.json
        run: python3 -m json.tool renovate.json > /dev/null
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
