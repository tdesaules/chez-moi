name: renovate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: .github/renovate-config.cjs
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.198.3
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
